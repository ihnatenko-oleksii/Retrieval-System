[project]
name = "retrieval-system"
version = "0.1.0"
description = "Local-first, modular RAG system with hybrid dense+BM25 retrieval, reranking, query rewriting, grounded citation generation, and a built-in evaluation/tuning harness."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["rag", "retrieval-augmented-generation", "information-retrieval", "chromadb", "bm25", "ollama", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "chromadb>=1.5.6",
    "fastapi>=0.135.3",
    "gradio>=5.0.0",
    "ollama>=0.5.0",
    "pandas>=3.0.2",
    "plotly>=6.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.10.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.6.0",
    "sentence-transformers>=5.3.0",
    "typer>=0.24.1",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*"]

[tool.coverage.report]
skip_empty = true
precision = 1
